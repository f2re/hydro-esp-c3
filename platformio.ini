[platformio]
default_envs = esp32c3_supermini
; Keep compiled framework/library objects outside the checkout so normal rebuilds,
; clean working trees and CI cache restores do not start from zero.
build_cache_dir = ~/.platformio/build-cache

[env:esp32c3_supermini]
; Known-working hardware baseline from the pre-August controller.
; Bump only after a real ESP32-C3/OLED/relay/Wi-Fi smoke-test.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

upload_speed = 460800
monitor_speed = 115200
monitor_encoding = utf8

; Serial port is intentionally not hard-coded. PlatformIO auto-detects it on
; macOS/Linux/Windows; tools/hydroctl.py also accepts an explicit --port.

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

extra_scripts = pre:scripts/build_flags.py

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32Async recommends strict compatibility + chain LDF for PlatformIO.
lib_compat_mode = strict
lib_ldf_mode = chain

lib_deps =
    arduino-libraries/NTPClient@3.2.1
    olikraus/U8g2@^2.35.7
    ESP32Async/AsyncTCP@3.3.2
    ESP32Async/ESPAsyncWebServer@3.6.0
    bblanchon/ArduinoJson@7.4.3
