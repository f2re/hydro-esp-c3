name: Patch install note

on:
  push:
    branches: [agent/final-integration-20260808]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch hydroctl first-boot hint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/hydroctl.py')
          s = p.read_text(encoding='utf-8')
          old = '        say("First boot: connect to Wi-Fi \'HydroESP-Setup\', then open http://192.168.4.1")'
          new = '        say("First boot: HydroESP-Setup is protected; read the KEY on OLED or Serial")\n        say("Then connect to HydroESP-Setup and open http://192.168.4.1")'
          if old not in s:
              raise SystemExit('expected install hint not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/hydroctl.py
          git commit -m "Fix protected commissioning install hint"
          git push
