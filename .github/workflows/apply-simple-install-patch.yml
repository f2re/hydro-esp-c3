name: Apply simple install patch

on:
  push:
    branches: [agent/simple-install-20260808]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch hydroctl
        run: python tools/_simplify_install_patch.py
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/hydroctl.py
          git diff --cached --quiet && exit 0
          git commit -m "Make install a predictable fresh setup"
          git push
