name: Apply install Wi-Fi prompt patch

on:
  push:
    branches: [agent/install-wifi-seed-20260808]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/_patch_install_wifi_prompt.py
      - shell: bash
        run: |
          set -euo pipefail
          rm tools/_patch_install_wifi_prompt.py
          rm .github/workflows/apply-install-wifi-prompt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prompt for Wi-Fi during installation"
          git push
