name: Inspect PlatformIO flash layout

on:
  push:
    branches: [agent/network-access-recovery-20260808]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade 'platformio>=6.1,<7'
      - run: pio run
      - name: Print upload command
        shell: bash
        run: |
          set +e
          pio run -t upload -v --upload-port /dev/null 2>&1 | tee /tmp/upload.log
          set -e
          grep -E 'write[_-]flash|bootloader\.bin|partitions\.bin|boot_app0\.bin|firmware\.bin' /tmp/upload.log || true
