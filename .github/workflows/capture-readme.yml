name: Capture README screenshots

on:
  push:
    branches: [agent/final-integration-20260808]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export embedded UI
        run: python tools/export_ui_preview.py .artifacts/ui-preview.html --mock
      - name: Render screenshots
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          BASE="file://${GITHUB_WORKSPACE}/.artifacts/ui-preview.html"
          mkdir -p docs/assets
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=1440,1120 --screenshot=docs/assets/ui-desktop-overview.png "$BASE"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=1440,1120 --screenshot=docs/assets/ui-desktop-hydraulics.png "$BASE?tab=hydraulics"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=390,844 --screenshot=docs/assets/ui-mobile-overview.png "$BASE"
      - name: Commit screenshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add generated UI screenshots"
          git push
