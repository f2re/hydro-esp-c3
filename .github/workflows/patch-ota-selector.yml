name: Patch OTA selector

on:
  push:
    branches: [agent/network-access-recovery-20260808]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch hydroctl OTA selection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/hydroctl.py')
          s = p.read_text(encoding='utf-8')
          old = '''    bins = [a for a in assets if a.get("name", "").endswith(".bin") and "hydro-esp-c3" in a.get("name", "")]
    sums = [a for a in assets if a.get("name", "").endswith(".sha256")]
    if not bins:
        raise HydroError("latest GitHub release contains no HydroESP-C3 .bin asset")

    asset = sorted(bins, key=lambda a: ("latest" not in a.get("name", ""), len(a.get("name", ""))))[0]
'''
          new = '''    bins = [a for a in assets if a.get("name", "").endswith(".bin") and "hydro-esp-c3" in a.get("name", "")]
    sums = [a for a in assets if a.get("name", "").endswith(".sha256")]
    ota_bins = [a for a in bins if "-ota.bin" in a.get("name", "").lower()]
    legacy_bins = [a for a in bins if "factory" not in a.get("name", "").lower()]
    candidates = ota_bins or legacy_bins
    if not candidates:
        raise HydroError("latest GitHub release contains no HydroESP-C3 OTA image")

    asset = sorted(
        candidates,
        key=lambda a: (
            "latest-ota.bin" not in a.get("name", "").lower(),
            "latest" not in a.get("name", "").lower(),
            len(a.get("name", "")),
        ),
    )[0]
'''
          if old not in s:
              raise SystemExit('release selector block not found')
          s = s.replace(old, new, 1)
          old2 = '''        if firmware.suffix.lower() != ".bin":
            raise HydroError("OTA file must have .bin extension")
        if firmware.stat().st_size < 10_000:
'''
          new2 = '''        if firmware.suffix.lower() != ".bin":
            raise HydroError("OTA file must have .bin extension")
        if "factory" in firmware.name.lower():
            raise HydroError("factory image is not an OTA image; flash it over USB at address 0x0")
        if firmware.stat().st_size < 10_000:
'''
          if old2 not in s:
              raise SystemExit('local OTA validation block not found')
          p.write_text(s.replace(old2, new2, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/hydroctl.py
          git commit -m "Select only OTA images for updater"
          git push
