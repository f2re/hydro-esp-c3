name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Materialize Web OTA reboot verification
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/web-ota-reboot-verification'
        shell: bash
        run: |
          set -euo pipefail
          python tools/.materialize_web_ota_verify.py
          if ! git diff --quiet -- src/web_ui_v2.h; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/web_ui_v2.h
            git commit -m "Verify Web OTA after controller reboot"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Restore PlatformIO caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/.cache
            ~/.platformio/build-cache
            .pio/libdeps
          key: ${{ runner.os }}-${{ runner.arch }}-pio-${{ hashFiles('platformio.ini', 'requirements-build.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pio-

      - name: Install PlatformIO Core
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Resolve project dependencies
        run: pio pkg install -e esp32c3_supermini

      - name: Check maintenance and hardware contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/hydroctl.py tools/usb_deploy.py tools/wifi_flash.py \
            tools/check_recovery_contract.py tools/check_display_contract.py \
            tools/check_build_cache_contract.py tools/check_install_wifi.py \
            tools/check_hardware_baseline.py tools/check_web_ui.py \
            tools/check_web_assets.py tools/check_schedule_builder.py \
            tools/export_ui_preview.py tools/make_factory_image.py scripts/build_flags.py
          python tools/hydroctl.py --help >/dev/null
          python tools/hydroctl.py install --help >/dev/null
          python tools/usb_deploy.py --help >/dev/null
          python tools/wifi_flash.py --help >/dev/null
          python tools/check_recovery_contract.py
          python tools/check_display_contract.py
          python tools/check_build_cache_contract.py
          python tools/check_install_wifi.py
          python tools/check_hardware_baseline.py
          python tools/make_factory_image.py --help >/dev/null
          sh -n install.sh update.sh deploy.sh wifi-flash.sh

      - name: Check embedded web UI, assets and schedule builder
        run: |
          python tools/check_web_ui.py
          python tools/check_web_assets.py
          python tools/check_schedule_builder.py

      - name: Export UI previews
        run: |
          python tools/export_ui_preview.py .artifacts/ui-preview.html --mock
          python tools/export_ui_preview.py .artifacts/ui-preview-schedule.html --mock --tab schedule

      - name: Render UI screenshots
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          BASE="file://${GITHUB_WORKSPACE}/.artifacts/ui-preview.html"
          SCHEDULE="file://${GITHUB_WORKSPACE}/.artifacts/ui-preview-schedule.html"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 \
            --window-size=1440,1120 --screenshot=.artifacts/ui-desktop-overview.png "$BASE"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 \
            --window-size=1440,1120 --screenshot=.artifacts/ui-desktop-schedule.png "$SCHEDULE"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 \
            --window-size=1440,1120 --screenshot=.artifacts/ui-desktop-hydraulics.png "$BASE?tab=hydraulics"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 \
            --window-size=390,844 --screenshot=.artifacts/ui-mobile-overview.png "$BASE"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 \
            --window-size=390,844 --screenshot=.artifacts/ui-mobile-schedule.png "$SCHEDULE"

      - name: Build ESP32-C3 firmware
        run: pio run

      - name: Verify build identity stays incremental
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="${GITHUB_SHA}"

          GITHUB_SHA=0000000000000000000000000000000000000000 pio run 2>&1 | tee /tmp/hydro-meta-fake.log
          if grep -qE "Compiling .*FrameworkArduino/" /tmp/hydro-meta-fake.log; then
            echo "ERROR: changing only build identity rebuilt FrameworkArduino" >&2
            exit 1
          fi

          GITHUB_SHA="${ACTUAL_SHA}" pio run 2>&1 | tee /tmp/hydro-meta-restore.log
          if grep -qE "Compiling .*FrameworkArduino/" /tmp/hydro-meta-restore.log; then
            echo "ERROR: restoring build identity rebuilt FrameworkArduino" >&2
            exit 1
          fi
          echo "incremental build identity: OK"

      - name: Build install image
        run: python tools/make_factory_image.py .artifacts/hydro-esp-c3-install.bin

      - name: Upload firmware and UI preview
        uses: actions/upload-artifact@v4
        with:
          name: hydro-esp-c3-${{ github.sha }}
          path: |
            .pio/build/esp32c3_supermini/firmware.bin
            .artifacts/hydro-esp-c3-install.bin
            .artifacts/ui-preview.html
            .artifacts/ui-preview-schedule.html
            .artifacts/ui-desktop-overview.png
            .artifacts/ui-desktop-schedule.png
            .artifacts/ui-desktop-hydraulics.png
            .artifacts/ui-mobile-overview.png
            .artifacts/ui-mobile-schedule.png
          if-no-files-found: error
          retention-days: 14
