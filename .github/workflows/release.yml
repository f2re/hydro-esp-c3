name: Release firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Restore PlatformIO caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/.cache
            ~/.platformio/build-cache
            .pio/libdeps
          key: ${{ runner.os }}-${{ runner.arch }}-pio-${{ hashFiles('platformio.ini', 'requirements-build.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pio-

      - name: Install PlatformIO Core
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Resolve project dependencies
        run: pio pkg install -e esp32c3_supermini

      - name: Build firmware
        env:
          HYDRO_VERSION: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: pio run

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          app=.pio/build/esp32c3_supermini/firmware.bin
          cp "$app" "dist/hydro-esp-c3-${GITHUB_REF_NAME}-ota.bin"
          cp "$app" "dist/hydro-esp-c3-latest-ota.bin"

          python tools/make_factory_image.py "dist/hydro-esp-c3-${GITHUB_REF_NAME}-factory.bin"

          # Human-facing one-file image for a clean USB/manual installation.
          cp "dist/hydro-esp-c3-${GITHUB_REF_NAME}-factory.bin" \
             "dist/hydro-esp-c3-install.bin"

          cd dist
          sha256sum *.bin > hydro-esp-c3.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/*.bin dist/hydro-esp-c3.sha256 \
            --verify-tag \
            --generate-notes \
            --title "HydroESP-C3 $GITHUB_REF_NAME"
