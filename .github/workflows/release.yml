name: Release firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade "platformio>=6.1,<7"

      - name: Build firmware
        env:
          HYDRO_VERSION: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: pio run

      - name: Prepare OTA and factory assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          app=.pio/build/esp32c3_supermini/firmware.bin
          cp "$app" "dist/hydro-esp-c3-${GITHUB_REF_NAME}-ota.bin"
          cp "$app" "dist/hydro-esp-c3-latest-ota.bin"

          python tools/make_factory_image.py "dist/hydro-esp-c3-${GITHUB_REF_NAME}-factory.bin"
          cp "dist/hydro-esp-c3-${GITHUB_REF_NAME}-factory.bin" \
             "dist/hydro-esp-c3-latest-factory.bin"

          cd dist
          sha256sum *.bin > hydro-esp-c3.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/*.bin dist/hydro-esp-c3.sha256 \
            --verify-tag \
            --generate-notes \
            --title "HydroESP-C3 $GITHUB_REF_NAME"
